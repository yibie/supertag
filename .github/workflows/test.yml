name: CI

on:
  push:
    branches:
      - main
  pull_request: {}
  workflow_dispatch:
    inputs:
      archive_board:
        description: 'Explicit historical Board npm/build check'
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      runtime: ${{ steps.paths.outputs.runtime }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: paths
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ "${{ github.event_name }}" == workflow_dispatch || -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
            echo 'runtime=true' >> "$GITHUB_OUTPUT"
          else
            git diff --name-only "$BASE_SHA" "$GITHUB_SHA" > /tmp/supertag-changed-paths
            if grep -Eq '(\.el$|\.sh$|^\.github/workflows/test\.yml$)' /tmp/supertag-changed-paths; then
              echo 'runtime=true' >> "$GITHUB_OUTPUT"
            else
              echo 'runtime=false' >> "$GITHUB_OUTPUT"
            fi
          fi

  guidance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check current guidance and local entrypoint links
        run: bash test/run-tests.sh --guidance

  test:
    needs: changes
    if: needs.changes.outputs.runtime == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Test the declared minimum (Package-Requires: emacs 29.1, which
        # also bundles org 9.6) plus the current stable release.
        emacs_version: ['29.1', '29.4']

    steps:
      - uses: actions/checkout@v4

      - uses: jcs090218/setup-emacs@master
        with:
          version: ${{ matrix.emacs_version }}

      - name: Install elisp dependencies
        # Emacs 29.1+ bundles org >= 9.6, satisfying Package-Requires; the
        # guarded org install stays as a safety net should the floor or the
        # runner image ever drift.
        run: |
          emacs -batch --eval "(progn (require 'package) (add-to-list 'package-archives '(\"melpa\" . \"https://melpa.org/packages/\")) (package-initialize) (package-refresh-contents) (package-install 'ht) (unless (package-installed-p 'org '(9 6)) (package-install (cadr (assq 'org package-archive-contents)))))"

      # test/run-tests.sh is already tracked with mode 100755 in git
      # (verified via `git ls-files -s test/run-tests.sh`), so no chmod
      # step is needed here.
      - name: Run tests
        env:
          TMPDIR: /tmp
        run: bash test/run-tests.sh

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-emacs-${{ matrix.emacs_version }}
          path: |
            /tmp/supertag-tests.*/*.log
            /tmp/supertag-entrypoints.*/*.log
            /tmp/supertag-entrypoints.*/exit-codes.txt

  gitignore:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Verify agent scratch rules stay root-scoped
        run: |
          root_scratch_dirs=".claude commands docs hooks logs qoder .qoder .pi .codegraph .reasonix .serena"
          for directory in ${root_scratch_dirs}; do
            git check-ignore -q --no-index "${directory}/scratch"
            if git check-ignore -q --no-index "ext/ignore-check/${directory}/source"; then
              echo "Nested source directory is unexpectedly ignored: ${directory}" >&2
              exit 1
            fi
          done
          grep -Fxq '/.agent-relay/' .gitignore
          ! grep -Fxq '.agent-relay/' .gitignore
          ! git check-ignore -q --no-index ext/board-ui/hooks/useWebSocket.ts

  board-ui:
    if: github.event_name == 'workflow_dispatch' && inputs.archive_board
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ext/board-ui/package-lock.json

      - name: Install Board UI dependencies
        working-directory: ext/board-ui
        run: npm ci

      - name: Build Board UI
        working-directory: ext/board-ui
        run: npm run build
